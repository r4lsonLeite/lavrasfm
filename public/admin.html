<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Painel — LavrasFM</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="/css/tailwind.css" rel="stylesheet">
<link href="/css/styles.css" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">

<header class="w-full top-0 sticky bg-surface border-b border-outline-variant z-50">
  <div class="flex justify-between items-center max-w-[1200px] mx-auto px-margin-mobile md:px-margin-desktop h-20 gap-4">
    <div class="flex items-baseline gap-3 min-w-0">
      <span class="font-headline-md text-headline-md font-bold text-primary">LavrasFM</span>
      <span class="font-label-sm text-label-sm text-on-surface-variant uppercase hidden sm:inline">Painel</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="/" target="_blank" rel="noopener"
         class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors hidden sm:flex items-center gap-1">
        <span class="material-symbols-outlined text-[18px]">open_in_new</span> Ver o site
      </a>
      <span class="font-label-sm text-label-sm text-on-surface-variant hidden md:inline" id="current-user"></span>
      <button id="logout"
              class="border border-outline-variant font-label-sm text-label-sm px-4 py-2 rounded hover:border-primary hover:text-primary transition-colors">
        Sair
      </button>
    </div>
  </div>

  <nav class="border-t border-outline-variant bg-surface-container-lowest">
    <div class="max-w-[1200px] mx-auto px-margin-mobile md:px-margin-desktop flex gap-1 overflow-x-auto" id="tabs">
      <button data-tab="noticias" class="tab font-body-md text-body-md px-4 py-4 border-b-2 whitespace-nowrap">Notícias</button>
      <button data-tab="videos" class="tab font-body-md text-body-md px-4 py-4 border-b-2 whitespace-nowrap">Vídeos &amp; Lives</button>
      <button data-tab="config" class="tab font-body-md text-body-md px-4 py-4 border-b-2 whitespace-nowrap">Rádio &amp; Site</button>
      <button data-tab="conta" class="tab font-body-md text-body-md px-4 py-4 border-b-2 whitespace-nowrap">Conta</button>
    </div>
  </nav>
</header>

<div id="toast" class="fixed top-24 right-4 z-[100] hidden max-w-sm font-body-md text-body-md px-5 py-4 rounded-DEFAULT shadow-lg"></div>

<main class="flex-grow max-w-[1200px] w-full mx-auto px-margin-mobile md:px-margin-desktop py-10">

  <!-- ------------------------------- NOTÍCIAS ------------------------------- -->
  <section data-panel="noticias" class="hidden flex-col gap-8">
    <div class="grid lg:grid-cols-[380px_1fr] gap-gutter items-start">

      <form id="news-form" class="bg-surface border border-outline-variant rounded-DEFAULT p-6 flex flex-col gap-4 lg:sticky lg:top-44">
        <div class="flex items-center justify-between">
          <h2 class="font-headline-md text-headline-md text-primary" id="news-form-title">Nova notícia</h2>
          <button type="button" id="news-reset"
                  class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary hidden">Cancelar edição</button>
        </div>
        <input type="hidden" name="id">

        <label class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Link da notícia *</span>
          <input name="url" type="url" required placeholder="https://portal.com.br/materia"
                 class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
          <span class="font-label-sm text-label-sm text-on-surface-variant">O card leva o visitante direto para esse endereço.</span>
        </label>

        <button type="button" id="buscar-noticia"
                class="border border-outline-variant font-label-sm text-label-sm px-4 py-3 rounded hover:border-primary hover:text-primary transition-colors flex items-center justify-center gap-2">
          <span class="material-symbols-outlined text-[18px]">download</span> Buscar título, resumo e foto
        </button>
        <div id="buscar-resultado" class="hidden font-label-sm text-label-sm px-4 py-3 rounded-DEFAULT"></div>

        <div id="imagem-previa" class="hidden flex flex-col gap-2">
          <img id="imagem-previa-img" alt="Prévia da foto da notícia"
               class="w-full h-32 object-cover rounded-DEFAULT border border-outline-variant">
          <p id="imagem-aviso" class="hidden font-label-sm text-label-sm px-3 py-2 rounded-DEFAULT bg-error-container text-on-error-container"></p>
        </div>

        <label class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Título *</span>
          <input name="title" required maxlength="300"
                 class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
        </label>

        <div class="grid grid-cols-2 gap-3">
          <label class="flex flex-col gap-1">
            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Categoria</span>
            <input name="category" list="categorias" placeholder="LOCAL"
                   class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
            <datalist id="categorias">
              <option value="LOCAL"></option><option value="MÚSICA"></option><option value="CULTURA"></option>
              <option value="ESPORTES"></option><option value="POLÍTICA"></option><option value="ENTREVISTA"></option>
              <option value="EVENTOS"></option><option value="GERAL"></option>
            </datalist>
          </label>
          <label class="flex flex-col gap-1">
            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Fonte</span>
            <input name="source" placeholder="Redação LavrasFM"
                   class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
          </label>
        </div>

        <label class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Resumo</span>
          <textarea name="excerpt" rows="3" maxlength="600"
                    class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0"></textarea>
        </label>

        <label class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Imagem (URL)</span>
          <input name="image_url" type="url" placeholder="https://..."
                 class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
        </label>

        <fieldset class="flex flex-col gap-2 border border-outline-variant rounded-DEFAULT p-4">
          <legend class="font-label-sm text-label-sm text-on-surface-variant uppercase px-1">Como destacar</legend>
          <div id="highlight-options" class="flex flex-col gap-2"></div>
          <label class="flex items-center gap-2 mt-2 pt-3 border-t border-outline-variant">
            <input type="checkbox" name="invert" class="rounded-DEFAULT border-outline-variant text-primary focus:ring-primary">
            <span class="font-body-md text-body-md">Card em fundo preto (chama mais atenção)</span>
          </label>
        </fieldset>

        <div class="grid grid-cols-2 gap-3">
          <label class="flex flex-col gap-1">
            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Publicado em</span>
            <input name="published_at" type="datetime-local"
                   class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
          </label>
          <label class="flex flex-col gap-1">
            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Ordem</span>
            <input name="position" type="number" value="0" step="1"
                   class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
            <span class="font-label-sm text-label-sm text-on-surface-variant">Menor aparece primeiro.</span>
          </label>
        </div>

        <label class="flex items-center gap-2">
          <input type="checkbox" name="active" checked class="rounded-DEFAULT border-outline-variant text-primary focus:ring-primary">
          <span class="font-body-md text-body-md">Publicada no site</span>
        </label>

        <button type="submit"
                class="bg-primary text-on-primary font-label-sm text-label-sm px-6 py-4 rounded hover:opacity-90 transition-opacity disabled:opacity-50">
          Salvar notícia
        </button>
      </form>

      <div class="flex flex-col gap-4">
        <div class="flex items-center justify-between">
          <h2 class="font-headline-md text-headline-md text-primary">Notícias cadastradas</h2>
          <span class="font-label-sm text-label-sm text-on-surface-variant" id="news-count"></span>
        </div>
        <div id="news-list" class="flex flex-col gap-3"></div>
      </div>
    </div>
  </section>

  <!-- -------------------------------- VÍDEOS -------------------------------- -->
  <section data-panel="videos" class="hidden flex-col gap-8">
    <div class="grid lg:grid-cols-[380px_1fr] gap-gutter items-start">

      <form id="video-form" class="bg-surface border border-outline-variant rounded-DEFAULT p-6 flex flex-col gap-4 lg:sticky lg:top-44">
        <div class="flex items-center justify-between">
          <h2 class="font-headline-md text-headline-md text-primary" id="video-form-title">Novo vídeo / live</h2>
          <button type="button" id="video-reset"
                  class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary hidden">Cancelar edição</button>
        </div>
        <input type="hidden" name="id">

        <label class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Link do YouTube *</span>
          <input name="youtube_url" required placeholder="https://www.youtube.com/watch?v=..."
                 class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
          <span class="font-label-sm text-label-sm text-on-surface-variant">Aceita links de vídeo, live, youtu.be e shorts.</span>
        </label>

        <div id="video-preview" class="hidden">
          <div class="aspect-video bg-surface-dim rounded-DEFAULT overflow-hidden border border-outline-variant">
            <img id="video-thumb" class="w-full h-full object-cover" alt="Prévia do vídeo">
          </div>
        </div>

        <label class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Título *</span>
          <input name="title" required maxlength="300"
                 class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
        </label>

        <label class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Descrição</span>
          <textarea name="description" rows="3" maxlength="600"
                    class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0"></textarea>
        </label>

        <fieldset class="flex flex-col gap-2 border border-outline-variant rounded-DEFAULT p-4">
          <legend class="font-label-sm text-label-sm text-on-surface-variant uppercase px-1">Tipo</legend>
          <label class="flex items-center gap-2">
            <input type="radio" name="kind" value="video" checked class="border-outline-variant text-primary focus:ring-primary">
            <span class="font-body-md text-body-md">Vídeo gravado</span>
          </label>
          <label class="flex items-center gap-2">
            <input type="radio" name="kind" value="live" class="border-outline-variant text-primary focus:ring-primary">
            <span class="font-body-md text-body-md">Transmissão ao vivo (mostra o selo AO VIVO)</span>
          </label>
        </fieldset>

        <label class="flex items-center gap-2">
          <input type="checkbox" name="featured" class="rounded-DEFAULT border-outline-variant text-primary focus:ring-primary">
          <span class="font-body-md text-body-md">Destacar na home (player grande)</span>
        </label>

        <label class="flex items-center gap-2">
          <input type="checkbox" name="autoplay" class="rounded-DEFAULT border-outline-variant text-primary focus:ring-primary">
          <span class="font-body-md text-body-md">Iniciar automaticamente, sem som</span>
        </label>

        <label class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Ordem</span>
          <input name="position" type="number" value="0" step="1"
                 class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
        </label>

        <label class="flex items-center gap-2">
          <input type="checkbox" name="active" checked class="rounded-DEFAULT border-outline-variant text-primary focus:ring-primary">
          <span class="font-body-md text-body-md">Visível no site</span>
        </label>

        <button type="submit"
                class="bg-primary text-on-primary font-label-sm text-label-sm px-6 py-4 rounded hover:opacity-90 transition-opacity disabled:opacity-50">
          Salvar vídeo
        </button>
      </form>

      <div class="flex flex-col gap-4">
        <div class="flex items-center justify-between">
          <h2 class="font-headline-md text-headline-md text-primary">Vídeos cadastrados</h2>
          <span class="font-label-sm text-label-sm text-on-surface-variant" id="video-count"></span>
        </div>
        <div id="video-list" class="flex flex-col gap-3"></div>
      </div>
    </div>
  </section>

  <!-- ------------------------------ CONFIGURAÇÕES --------------------------- -->
  <section data-panel="config" class="hidden flex-col gap-8">
    <form id="settings-form" class="grid md:grid-cols-2 gap-gutter items-start">

      <div class="bg-surface border border-outline-variant rounded-DEFAULT p-6 flex flex-col gap-4">
        <h2 class="font-headline-md text-headline-md text-primary">Transmissão ao vivo</h2>

        <label class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">URL do streaming *</span>
          <input name="stream_url" placeholder="https://servidor.com:8000/stream"
                 class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
          <span class="font-label-sm text-label-sm text-on-surface-variant">
            O endereço do áudio em si — não o link da página onde a rádio toca.
            Pode colar também um arquivo .m3u, .pls ou .asx: eu extraio a URL de dentro dele.
          </span>
        </label>

        <button type="button" id="resolve-stream"
                class="border border-outline-variant font-label-sm text-label-sm px-4 py-3 rounded hover:border-primary hover:text-primary transition-colors flex items-center justify-center gap-2">
          <span class="material-symbols-outlined text-[18px]">travel_explore</span> Verificar endereço
        </button>
        <div id="resolve-result" class="hidden font-body-md text-body-md px-4 py-3 rounded-DEFAULT"></div>

        <label class="flex items-start gap-2 border border-outline-variant rounded-DEFAULT p-4">
          <input type="checkbox" name="stream_relay" value="1"
                 class="mt-1 rounded-DEFAULT border-outline-variant text-primary focus:ring-primary">
          <span>
            <span class="font-body-md text-body-md block">Retransmitir pelo servidor</span>
            <span class="font-label-sm text-label-sm text-on-surface-variant">
              Ligue se o áudio não tocar no site. Resolve transmissão em http dentro de site https
              e servidores que bloqueiam o navegador. O áudio passa a consumir a banda do seu servidor.
            </span>
          </span>
        </label>

        <label class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Formato</span>
          <select name="stream_format"
                  class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
            <option value="audio/mpeg">MP3 (audio/mpeg)</option>
            <option value="audio/aac">AAC (audio/aac)</option>
            <option value="audio/ogg">OGG (audio/ogg)</option>
            <option value="application/vnd.apple.mpegurl">HLS (.m3u8)</option>
          </select>
        </label>

        <label class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">No ar agora</span>
          <input name="now_playing" placeholder="Programa da Manhã"
                 class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
          <span class="font-label-sm text-label-sm text-on-surface-variant">Aparece ao lado do botão de play, no site.</span>
        </label>

        <div class="border-t border-outline-variant pt-4 flex flex-col gap-3">
          <button type="button" id="test-stream"
                  class="border border-outline-variant font-label-sm text-label-sm px-4 py-3 rounded hover:border-primary hover:text-primary transition-colors flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-[18px]">play_circle</span> Testar transmissão
          </button>
          <p id="stream-status" class="font-label-sm text-label-sm text-on-surface-variant"></p>
        </div>
      </div>

      <div class="bg-surface border border-outline-variant rounded-DEFAULT p-6 flex flex-col gap-4">
        <h2 class="font-headline-md text-headline-md text-primary">Identidade e contato</h2>

        <label class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Nome da rádio</span>
          <input name="station_name"
                 class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
        </label>

        <label class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Slogan</span>
          <input name="tagline"
                 class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
        </label>

        <div class="grid grid-cols-2 gap-3">
          <label class="flex flex-col gap-1">
            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Instagram</span>
            <input name="instagram" type="url" placeholder="https://instagram.com/..."
                   class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
          </label>
          <label class="flex flex-col gap-1">
            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Facebook</span>
            <input name="facebook" type="url" placeholder="https://facebook.com/..."
                   class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
          </label>
          <label class="flex flex-col gap-1">
            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Canal no YouTube</span>
            <input name="youtube_channel" type="url" placeholder="https://youtube.com/@..."
                   class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
          </label>
          <label class="flex flex-col gap-1">
            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">WhatsApp</span>
            <input name="whatsapp" placeholder="5535999998888"
                   class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
          </label>
        </div>

        <label class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">E-mail de contato</span>
          <input name="contact_email" type="email"
                 class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
        </label>

        <label class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Texto do rodapé</span>
          <input name="footer_text"
                 class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
        </label>
      </div>

      <div class="md:col-span-2">
        <button type="submit"
                class="bg-primary text-on-primary font-label-sm text-label-sm px-8 py-4 rounded hover:opacity-90 transition-opacity disabled:opacity-50">
          Salvar configurações
        </button>
      </div>
    </form>
  </section>

  <!-- --------------------------------- CONTA -------------------------------- -->
  <section data-panel="conta" class="hidden flex-col gap-8">
    <form id="password-form" class="bg-surface border border-outline-variant rounded-DEFAULT p-6 flex flex-col gap-4 max-w-md">
      <h2 class="font-headline-md text-headline-md text-primary">Alterar senha</h2>

      <label class="flex flex-col gap-1">
        <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Senha atual</span>
        <input name="current_password" type="password" required autocomplete="current-password"
               class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
      </label>

      <label class="flex flex-col gap-1">
        <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Nova senha</span>
        <input name="new_password" type="password" required minlength="8" autocomplete="new-password"
               class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-3 py-2 font-body-md text-body-md focus:border-primary focus:ring-0">
        <span class="font-label-sm text-label-sm text-on-surface-variant">Mínimo de 8 caracteres. Você precisará entrar de novo.</span>
      </label>

      <button type="submit"
              class="bg-primary text-on-primary font-label-sm text-label-sm px-6 py-4 rounded hover:opacity-90 transition-opacity disabled:opacity-50">
        Alterar senha
      </button>
    </form>
  </section>
</main>

<script src="/js/admin.js"></script>
</body>
</html>
