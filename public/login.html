<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Entrar — Painel LavrasFM</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="/css/tailwind.css" rel="stylesheet">
<link href="/css/styles.css" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center px-margin-mobile">

<main class="w-full max-w-[400px]">
  <div class="text-center mb-8">
    <div class="font-headline-md text-headline-md font-bold text-primary">LavrasFM</div>
    <p class="font-body-md text-body-md text-on-surface-variant mt-1">Painel administrativo</p>
  </div>

  <form id="login-form" class="bg-surface border border-outline-variant rounded-DEFAULT p-8 flex flex-col gap-5">
    <label class="flex flex-col gap-2">
      <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Usuário</span>
      <input name="username" required autocomplete="username" autofocus
             class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-4 py-3 font-body-md text-body-md focus:border-primary focus:ring-0">
    </label>

    <label class="flex flex-col gap-2">
      <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Senha</span>
      <input name="password" type="password" required autocomplete="current-password"
             class="border border-outline-variant bg-surface-container-lowest rounded-DEFAULT px-4 py-3 font-body-md text-body-md focus:border-primary focus:ring-0">
    </label>

    <p id="error" class="hidden font-body-md text-body-md text-error bg-error-container px-4 py-3 rounded-DEFAULT"></p>

    <button type="submit"
            class="bg-primary text-on-primary font-label-sm text-label-sm px-6 py-4 rounded hover:opacity-90 transition-opacity disabled:opacity-50">
      Entrar
    </button>
  </form>

  <p class="text-center mt-6">
    <a href="/" class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary hover:underline">← Voltar para o site</a>
  </p>
</main>

<script src="/js/login.js"></script>
</body>
</html>
