<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>LavrasFM — Rádio ao vivo</title>
<meta name="description" content="LavrasFM: rádio ao vivo, notícias e vídeos de Lavras e região.">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="/css/styles.css" rel="stylesheet">
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pb-24">

<!-- Barra de navegação -->
<header class="w-full top-0 sticky bg-surface border-b border-outline-variant z-50">
  <div class="flex justify-between items-center max-w-[1200px] mx-auto px-margin-mobile md:px-margin-desktop h-20">
    <a href="/" class="font-headline-md text-headline-md font-bold text-primary" data-station-name>LavrasFM</a>
    <nav class="hidden md:flex gap-8 items-center h-full">
      <a class="font-body-md text-body-md text-primary border-b-2 border-primary h-full flex items-center pt-[2px]" href="/">Início</a>
      <a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors h-full flex items-center" href="#noticias">Notícias</a>
      <a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors h-full flex items-center" href="#videos">Vídeos</a>
      <a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors h-full flex items-center" href="#contato">Contato</a>
    </nav>
    <div class="flex items-center gap-4">
      <button data-play-toggle class="bg-primary text-on-primary font-label-sm text-label-sm px-6 py-3 rounded hover:opacity-90 transition-opacity flex items-center gap-2">
        <span class="material-symbols-outlined text-[18px]" data-play-icon>play_arrow</span>
        <span data-play-label>Ouvir ao vivo</span>
      </button>
    </div>
  </div>
</header>

<main class="flex-grow max-w-[1200px] w-full mx-auto px-margin-mobile md:px-margin-desktop py-10 flex flex-col gap-[56px]">

  <!-- Capa: manchete grande + 3 destaques laterais + grade -->
  <section id="noticias">
    <div data-cover>
      <p class="font-body-md text-body-md text-on-surface-variant">Carregando notícias…</p>
    </div>
  </section>

  <!-- Vídeos e lives -->
  <section id="videos">
    <h2 class="font-headline-md text-headline-md text-primary mb-6 pb-4 border-b-2 border-primary">Vídeos &amp; Lives</h2>
    <div data-video-slot></div>
  </section>
</main>

<!-- Rodapé -->
<footer id="contato" class="w-full bg-surface-container border-t border-outline-variant mt-auto">
  <div class="flex flex-col md:flex-row justify-between items-center max-w-[1200px] mx-auto px-margin-mobile md:px-margin-desktop py-12 gap-8 md:gap-0">
    <div class="font-headline-md text-headline-md text-primary font-bold" data-station-name>LavrasFM</div>
    <nav class="flex flex-wrap justify-center gap-6 md:gap-8" data-social-links></nav>
    <div class="font-label-sm text-label-sm text-on-surface text-center" data-footer-text></div>
  </div>
</footer>

<!-- Player fixo -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant z-50" data-player-bar>
  <div class="max-w-[1200px] mx-auto px-margin-mobile md:px-margin-desktop h-20 flex items-center justify-between gap-4 md:gap-8">
    <div class="flex items-center gap-4 min-w-0 md:min-w-[240px]">
      <button data-play-toggle class="w-12 h-12 bg-primary text-on-primary rounded flex items-center justify-center hover:opacity-90 transition-opacity shrink-0" aria-label="Tocar ou pausar a rádio">
        <span class="material-symbols-outlined text-[32px]" data-play-icon>play_arrow</span>
      </button>
      <div class="min-w-0">
        <div class="font-label-sm text-label-sm text-primary flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-error block animate-pulse"></span>
          <span data-player-status>AO VIVO</span>
        </div>
        <div class="font-body-md text-body-md text-on-surface-variant truncate" data-now-playing>Programação Musical</div>
      </div>
    </div>

    <div class="flex-grow items-center gap-1 h-8 text-primary hidden md:flex" data-equalizer>
      <span class="eq-bar" style="animation-delay:0ms"></span>
      <span class="eq-bar" style="animation-delay:90ms"></span>
      <span class="eq-bar" style="animation-delay:180ms"></span>
      <span class="eq-bar" style="animation-delay:270ms"></span>
      <span class="eq-bar" style="animation-delay:360ms"></span>
      <span class="eq-bar" style="animation-delay:450ms"></span>
      <span class="eq-bar" style="animation-delay:540ms"></span>
      <span class="eq-bar" style="animation-delay:630ms"></span>
      <span class="eq-bar" style="animation-delay:720ms"></span>
      <span class="eq-bar" style="animation-delay:810ms"></span>
      <span class="eq-bar" style="animation-delay:900ms"></span>
      <span class="eq-bar" style="animation-delay:990ms"></span>
    </div>

    <div class="flex items-center gap-3 shrink-0">
      <button data-mute-toggle class="material-symbols-outlined text-on-surface-variant hover:text-primary cursor-pointer transition-colors" title="Silenciar" data-volume-icon>volume_up</button>
      <input data-volume type="range" min="0" max="100" value="80" class="volume w-24 hidden md:block" aria-label="Volume">
    </div>
  </div>
</div>

<script src="/js/player.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
