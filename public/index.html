<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>{{STATION_NAME}} — Rádio ao vivo</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{SITE_URL}}/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b4aa8">

<!-- Prévia ao compartilhar no WhatsApp, Facebook, X e afins -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{STATION_NAME}}">
<meta property="og:title" content="{{STATION_NAME}} — Rádio ao vivo">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{SITE_URL}}/">
<meta property="og:image" content="{{SITE_URL}}/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="/css/base.css" rel="stylesheet">
<link href="/css/tailwind.css" rel="stylesheet">
<link href="/css/styles.css" rel="stylesheet">
</head>
<body class="moldura-ondas text-branco font-body-md min-h-screen flex flex-col pb-24">

<!-- Cabeçalho -->
<header class="text-branco">

  <div class="max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop">
    <div class="flex items-center justify-between gap-6 py-4">
      <a href="/" class="shrink-0" aria-label="Página inicial da {{STATION_NAME}}">
        <img src="/img/logo-branco.png" alt="{{STATION_NAME}}" class="h-11 md:h-14 w-auto">
      </a>

      <nav class="hidden lg:flex items-center gap-7" aria-label="Seções do site">
        <a class="menu-item menu-ativo" href="#topo">Início</a>
        <a class="menu-item" href="#noticias">Notícias</a>
        <a class="menu-item" href="#videos">Vídeos</a>
        <a class="menu-item" href="#contato">Contato</a>
      </nav>

      <div class="flex items-center gap-3 shrink-0">
        <button data-play-toggle
                class="bg-gradiente-laranja text-branco font-display font-bold text-[13px] tracking-wide uppercase pl-4 pr-5 py-3 rounded-full shadow-carta hover:brightness-105 transition flex items-center gap-2">
          <span data-play-icon data-icone="tocar" data-icone-tamanho="20"></span>
          <span data-play-label>Ouvir ao vivo</span>
        </button>
      </div>
    </div>

    <!-- Menu em telas pequenas -->
    <nav class="lg:hidden flex items-center gap-5 overflow-x-auto pb-3 -mt-1" aria-label="Seções do site">
      <a class="menu-item menu-ativo" href="#topo">Início</a>
      <a class="menu-item" href="#noticias">Notícias</a>
      <a class="menu-item" href="#videos">Vídeos</a>
      <a class="menu-item" href="#contato">Contato</a>
    </nav>
  </div>
</header>

<main id="topo" class="flex-grow">
  <div class="max-w-[1320px] w-full mx-auto px-3 md:px-5">
    <div class="folha bg-fundo text-tinta rounded-2xl px-margin-mobile md:px-margin-desktop py-6 md:py-8 flex flex-col gap-10">

    <!-- Capa: manchete + últimas notícias -->
    <section id="noticias" class="grid grid-cols-1 lg:grid-cols-[minmax(0,1.85fr)_minmax(0,1fr)] gap-6">
      <div data-manchete></div>
      <aside data-ultimas></aside>
    </section>

    <!-- Demais notícias -->
    <section data-grade-noticias></section>

    <!-- Vídeos e lives -->
    <section id="videos">
      <div class="flex items-center gap-4 mb-5">
        <h2 class="font-display text-[22px] font-extrabold text-tinta uppercase tracking-tight">Vídeos &amp; Lives</h2>
        <span class="h-1 flex-grow bg-gradiente-laranja rounded-full max-w-[120px]"></span>
      </div>
      <div data-video-slot></div>
    </section>
    </div>
  </div>
</main>

<!-- Rodapé -->
<footer id="contato" class="rodape-veu text-branco mt-6">

  <div class="max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop py-8 flex flex-col md:flex-row md:items-center justify-between gap-6">
    <div class="flex flex-col gap-3">
      <!-- self-start: sem isso o flex-col estica a imagem na largura do rodapé -->
      <img src="/img/logo-branco.png" alt="{{STATION_NAME}}" class="h-12 w-auto self-start">
      <p class="font-body-md text-[14px] text-azul-100 max-w-[38ch]" data-tagline></p>
    </div>

    <nav class="flex flex-wrap gap-x-6 gap-y-2" data-social-links aria-label="Redes sociais"></nav>
  </div>

  <div class="border-t border-white/20">
    <div class="max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop py-4 text-[13px] text-azul-100"
         data-footer-text></div>
  </div>
</footer>

<!-- Player fixo -->
<div class="fixed bottom-0 left-0 w-full bg-gradiente-azul text-branco border-t border-white/15 z-50 shadow-player" data-player-bar>
  <div class="max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop h-20 flex items-center gap-4 md:gap-6">

    <img src="/img/marca.png" alt="" class="h-11 w-11 rounded-full shrink-0 hidden sm:block">

    <div class="min-w-0 flex-grow sm:flex-grow-0 sm:w-[240px]">
      <div class="font-label-sm text-label-sm text-amarelo-300 flex items-center gap-2 uppercase">
        <span class="w-2 h-2 rounded-full bg-ao-vivo block animate-pulse"></span>
        <span data-player-status>Ao vivo</span>
      </div>
      <div class="font-body-md text-[15px] font-semibold truncate" data-now-playing>Programação Musical</div>
      <div class="font-body-md text-[12px] text-azul-100 truncate" data-station-name>LavrasFM</div>
    </div>

    <button data-play-toggle
            class="w-14 h-14 bg-gradiente-laranja rounded-full flex items-center justify-center shrink-0 hover:brightness-110 transition shadow-carta"
            aria-label="Tocar ou pausar a rádio">
      <span data-play-icon data-icone="tocar" data-icone-tamanho="30"></span>
    </button>

    <div class="hidden md:flex items-center gap-3 shrink-0">
      <button data-mute-toggle class="text-azul-100 hover:text-branco transition" title="Silenciar" data-volume-icon data-icone="volume-alto"></button>
      <input data-volume type="range" min="0" max="100" value="80" class="volume w-28" aria-label="Volume">
    </div>

    <div class="hidden lg:flex flex-grow items-center gap-1 h-8 text-amarelo-300" data-equalizer>
      <span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span>
      <span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span>
      <span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span>
      <span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span>
    </div>

    <span class="hidden xl:block font-label-sm text-label-sm text-azul-100 uppercase shrink-0" data-tagline-curta></span>

    <button data-mute-toggle class="md:hidden text-azul-100 shrink-0" title="Silenciar" data-volume-icon data-icone="volume-alto"></button>
  </div>
</div>

<script src="/js/icones.js"></script>
<script src="/js/player.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
